<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mud and Pace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo-light.svg">
  <link rel="apple-touch-icon" href="logo-light.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('mudandpace.theme');
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {
        // Si localStorage no está disponible, se usa el tema claro.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
